include skwd-theme.conf
include skwd-tabs.conf
# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
disable_ligatures never

# Window
window_padding_width 8
# Allow Hyprland to handle the true opacity, but set a deep base for the glass effect
background            #1e1e2e 
foreground            #cdd6f4
selection_foreground  #1e1e2e
selection_background  #f5e0dc
url_color             #89b4fa

# Cursor
cursor                #f5e0dc
cursor_shape          beam
cursor_blink_interval 0.5

# Modern Tab Bar
tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
active_tab_foreground       #11111b
active_tab_background       #ffffff
active_tab_font_style       bold
inactive_tab_foreground     #cdd6f4
inactive_tab_background     #181825
inactive_tab_font_style     normal

# Catppuccin Mocha 16 Colors
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

# Behavior Tweaks
scrollback_lines 10000
mouse_map left click ungrabbed mouse_handle_click selection link prompt
enable_audio_bell no
copy_on_select yes
strip_trailing_spaces smart
map ctrl+shift+h launch --location=hsplit
map ctrl+shift+b launch --location=vsplit
enabled_layouts tall:bias=70;full_size=1;mirrored=false, fat, grid, stack
map ctrl+shift+l next_layout
# Zoom into a window (toggle stack layout)
map ctrl+shift+z toggle_layout stack
allow_remote_control yes
listen_on unix:/tmp/mykitty